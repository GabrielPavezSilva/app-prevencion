server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Todas las rutas no encontradas vuelven a index.html (React Router)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cacheo de assets estáticos generados por Vite (tienen hash en el nombre)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}

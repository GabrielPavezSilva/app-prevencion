# Lint del backend. Se declara la selección explícita porque el default de ruff
# cambia entre versiones y el CI instala la última: sin esto, una versión nueva
# rompe el pipeline sin que nadie haya tocado el código.
#
# Errores reales (pyflakes + errores de sintaxis/indentación), no estilo.
target-version = "py311"
line-length = 120

[lint]
select = ["E4", "E7", "E9", "F"]

[lint.per-file-ignores]
# Los smokes fijan DATABASE_URL antes de importar la app: los imports van
# despues a proposito y estan marcados con noqa.
"tests/*" = ["E402"]
"sync_personal.py" = ["E402"]

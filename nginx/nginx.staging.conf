events {
    worker_connections 1024;
}

http {
    client_max_body_size 10M;

    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;

    server {
        listen 80;
        server_name _;   # accedido vía SSH tunnel (localhost:8083)

        # ── API Backend (staging) ────────────────
        location /api/ {
            proxy_pass         http://backend-staging:8000/api/;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;
        }

        location /docs {
            proxy_pass       http://backend-staging:8000/docs;
            proxy_set_header Host $host;
        }
        location /openapi.json {
            proxy_pass       http://backend-staging:8000/openapi.json;
            proxy_set_header Host $host;
        }

        # ── Frontend SPA (staging) ───────────────
        location / {
            proxy_pass         http://frontend-staging:80/;
            proxy_http_version 1.1;
            proxy_set_header   Host            $host;
            proxy_set_header   X-Real-IP       $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}

# Nginx interno del stack de producción (compose.yml).
# Escucha en :80 dentro de la red del compose; el TLS y el certificado de
# pr.civot.cramer.cl los termina el proxy del host, que reenvía a 127.0.0.1:8082.

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Tamaño máximo de cuerpo (importaciones de Excel)
    client_max_body_size 25M;

    sendfile   on;
    tcp_nopush on;

    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_types        text/plain text/css application/javascript application/json
                      image/svg+xml application/xml;

    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;

    # El proxy del host ya trae el esquema real. Si no lo mandara, asumimos http.
    map $http_x_forwarded_proto $fwd_proto {
        default $http_x_forwarded_proto;
        ""      $scheme;
    }

    server {
        listen 80;
        # Detrás del proxy del host; acepta cualquier Host para no romper el
        # healthcheck por IP. El filtrado por dominio lo hace el edge.
        server_name pr.civot.cramer.cl _;

        # ── API Backend ──────────────────────────
        location /api/ {
            proxy_pass         http://backend:8000/api/;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $fwd_proto;

            # Timeouts para reportes y exportaciones .xlsx grandes
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;
        }

        # Healthcheck del backend, útil para el monitoreo del host
        location = /health {
            proxy_pass       http://backend:8000/health;
            proxy_set_header Host $host;
            access_log       off;
        }

        # Swagger — el backend lo deshabilita cuando ENVIRONMENT=production,
        # así que en prod estas rutas devuelven 404 desde FastAPI.
        location /docs {
            proxy_pass       http://backend:8000/docs;
            proxy_set_header Host $host;
        }
        location /openapi.json {
            proxy_pass       http://backend:8000/openapi.json;
            proxy_set_header Host $host;
        }

        # ── Frontend SPA ─────────────────────────
        location / {
            proxy_pass         http://frontend:80/;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $fwd_proto;
        }
    }
}

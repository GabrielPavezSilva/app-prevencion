name: Deploy

on:
  push:
    branches: [main]

# Un deploy a la vez: dos pushes seguidos a main lanzaban dos runs en paralelo
# sobre el mismo VPS y el `compose up` del viejo podia pisar al nuevo. No se
# cancela el que esta corriendo — un deploy cortado a medias es peor.
concurrency:
  group: deploy-main
  cancel-in-progress: false

# El owner va en minusculas a mano: GHCR exige repositorio en minusculas y
# `github.repository_owner` conserva las mayusculas del usuario, lo que hacia
# fallar el build con "repository name must be lowercase".
env:
  IMAGE_BACKEND: ghcr.io/gabrielpavezsilva/prevencion-backend
  IMAGE_FRONTEND: ghcr.io/gabrielpavezsilva/prevencion-frontend

jobs:
  build:
    name: Build & Push Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      sha: ${{ github.sha }}

    steps:
      - uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push backend
        uses: docker/build-push-action@v5
        with:
          context: ./Backend
          push: true
          tags: |
            ${{ env.IMAGE_BACKEND }}:latest
            ${{ env.IMAGE_BACKEND }}:${{ github.sha }}

      - name: Build & push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./Frontend
          push: true
          build-args: |
            VITE_API_URL=${{ secrets.VITE_API_URL }}
          tags: |
            ${{ env.IMAGE_FRONTEND }}:latest
            ${{ env.IMAGE_FRONTEND }}:${{ github.sha }}

  deploy:
    name: Deploy on VPS
    runs-on: self-hosted
    needs: build

    steps:
      - uses: actions/checkout@v4

      - name: Login to GHCR
        run: echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Pull new images
        run: |
          docker pull ${{ env.IMAGE_BACKEND }}:latest
          docker pull ${{ env.IMAGE_FRONTEND }}:latest

      # La ruta que había acá apuntaba al checkout de la lavandería
      # (/opt/etl-bd/proyectos-rrhh/lavanderia/app-lavanderia): un deploy de
      # prevención habría reiniciado el stack de la otra aplicación. Definir la
      # variable DEPLOY_DIR del repositorio (Settings → Variables) con la ruta
      # del checkout de prevención en el VPS antes del primer deploy.
      - name: Rolling restart
        run: |
          set -e
          if [ -z "${{ vars.DEPLOY_DIR }}" ]; then
            echo "Falta la variable DEPLOY_DIR con la ruta del checkout en el VPS."
            exit 1
          fi
          cd "${{ vars.DEPLOY_DIR }}"
          docker compose up -d --no-deps --wait backend
          docker compose up -d --no-deps --wait frontend

      - name: Cleanup old images
        run: docker image prune -f

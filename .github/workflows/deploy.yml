name: Deploy

on:
  push:
    branches: [main]

# Un deploy a la vez: dos pushes seguidos a main lanzaban dos runs en paralelo
# sobre el mismo VPS y el `compose up` del viejo podia pisar al nuevo. No se
# cancela el que esta corriendo — un deploy cortado a medias es peor.
concurrency:
  group: deploy-main
  cancel-in-progress: false

# El owner va en minusculas a mano: GHCR exige repositorio en minusculas y
# `github.repository_owner` conserva las mayusculas del usuario, lo que hacia
# fallar el build con "repository name must be lowercase".
env:
  IMAGE_BACKEND: ghcr.io/gabrielpavezsilva/prevencion-backend
  IMAGE_FRONTEND: ghcr.io/gabrielpavezsilva/prevencion-frontend

jobs:
  build:
    name: Build & Push Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      sha: ${{ github.sha }}

    steps:
      - uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push backend
        uses: docker/build-push-action@v5
        with:
          context: ./Backend
          push: true
          tags: |
            ${{ env.IMAGE_BACKEND }}:latest
            ${{ env.IMAGE_BACKEND }}:${{ github.sha }}

      - name: Build & push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./Frontend
          push: true
          build-args: |
            VITE_API_URL=${{ secrets.VITE_API_URL }}
          tags: |
            ${{ env.IMAGE_FRONTEND }}:latest
            ${{ env.IMAGE_FRONTEND }}:${{ github.sha }}

  deploy:
    name: Deploy on VPS
    # Apagado mientras el deploy se hace a mano en el VPS: sin la variable
    # DEPLOY_DIR el job se salta entero. Hoy ademas no hay ningun runner
    # registrado en este repositorio, asi que sin esta guarda cada merge dejaba
    # un job encolado ~24 h hasta fallar por timeout.
    #
    # Para reactivarlo (requiere admin del repositorio): registrar el runner con
    # la label `prevencion` y definir DEPLOY_DIR — ver
    # docs/bootstrap-produccion.md. La label evita que el job caiga en el runner
    # de otro proyecto del mismo dueno y reinicie el stack equivocado.
    if: vars.DEPLOY_DIR != ''
    runs-on: [self-hosted, prevencion]
    needs: build

    steps:
      - uses: actions/checkout@v4

      - name: Login to GHCR
        run: echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Pull new images
        run: |
          docker pull ${{ env.IMAGE_BACKEND }}:latest
          docker pull ${{ env.IMAGE_FRONTEND }}:latest

      # La ruta que había acá apuntaba al checkout de la lavandería
      # (/opt/etl-bd/proyectos-rrhh/lavanderia/app-lavanderia): un deploy de
      # prevención habría reiniciado el stack de la otra aplicación. Por eso la
      # ruta vive en la variable DEPLOY_DIR del repositorio, que ademas es la
      # que habilita este job.
      - name: Rolling restart
        run: |
          set -e
          cd "${{ vars.DEPLOY_DIR }}"
          docker compose up -d --no-deps --wait backend
          docker compose up -d --no-deps --wait frontend

      - name: Cleanup old images
        run: docker image prune -f

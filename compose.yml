# Stack de PRODUCCIÓN — http://pr.civot.cramer.cl
#
#   docker compose up -d
#
# El TLS y el registro A de pr.civot.cramer.cl se gestionan fuera de este stack
# (nginx/Caddy del host, o el edge de Cramer). Este compose publica un único
# puerto en loopback — 127.0.0.1:8082, configurable con HTTP_PORT — que ese
# proxy debe reenviar (ojo con no chocar con el stack de lavandería del VPS):
#
#   proxy_pass http://127.0.0.1:8082;
#   proxy_set_header Host              $host;
#   proxy_set_header X-Forwarded-Proto $scheme;   # <- imprescindible
#
# X-Forwarded-Proto importa porque la cookie de sesión sale con Secure=True en
# producción: sin HTTPS efectivo en el navegador, el login no persiste.

name: prevencion

services:

  # ── Base de datos PostgreSQL ─────────────────────────────────────────────
  # Nombre, usuario y contraseña salen SIEMPRE del .env: no hay valor por
  # defecto, a propósito. `${VAR:-x}` significa "usá x si VAR está vacía o no
  # existe", así que un .env incompleto levantaba la base con el nombre
  # heredado de la lavandería (`civot`) sin avisar. Con `${VAR:?mensaje}`
  # compose aborta y dice qué falta.
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${POSTGRES_DB:?falta POSTGRES_DB en .env}
      POSTGRES_USER:     ${POSTGRES_USER:?falta POSTGRES_USER en .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?falta POSTGRES_PASSWORD en .env}
      TZ:                America/Santiago
      PGTZ:              America/Santiago
    command: ["postgres", "-c", "timezone=America/Santiago"]
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - postgres_backups:/backups
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    # Solo loopback: es el extremo remoto del túnel SSH que usa compose.dev.yml
    # para trabajar en local contra estos datos. Nunca exponerlo a 0.0.0.0.
    ports:
      - "127.0.0.1:5433:5432"
    labels:
      ofelia.enabled: "true"
      ofelia.job-exec.db-backup.schedule: "0 3 * * *"
      ofelia.job-exec.db-backup.command: >
        bash -c "pg_dump -U ${POSTGRES_USER} ${POSTGRES_DB}
        | gzip > /backups/db_$(date +%Y%m%d_%H%M%S).sql.gz
        && find /backups -name '*.sql.gz' -mtime +30 -delete
        && echo 'Backup OK'"

  # ── Backend FastAPI ──────────────────────────────────────────────────────
  backend:
    image: ghcr.io/gabrielpavezsilva/prevencion-backend:latest
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      JWT_SECRET_KEY:     ${JWT_SECRET_KEY:?falta JWT_SECRET_KEY en .env}
      JWT_EXPIRE_MINUTES: 480
      ENVIRONMENT:        ${ENVIRONMENT:-production}
      # El SPA se sirve desde el mismo origen (nginx enruta /api), así que el
      # navegador no hace CORS. Se deja configurable por si algún día se separa.
      CORS_ORIGINS:       ${CORS_ORIGINS:-http://pr.civot.cramer.cl,https://pr.civot.cramer.cl}
      # Base de RRHH (fuente del sync de personal). El software corre en el
      # mismo servidor que esa base, así que no hace falta túnel: apunta al
      # host de Docker. En local se usa el túnel SSH en el puerto 5434.
      EMPLOYEES_DB_HOST:     ${EMPLOYEES_DB_HOST:-host.docker.internal}
      EMPLOYEES_DB_PORT:     ${EMPLOYEES_DB_PORT:-5432}
      EMPLOYEES_DB_NAME:     ${EMPLOYEES_DB_NAME:-rh_cramer}
      EMPLOYEES_DB_USER:     ${EMPLOYEES_DB_USER}
      EMPLOYEES_DB_PASSWORD: ${EMPLOYEES_DB_PASSWORD}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    labels:
      ofelia.enabled: "true"
      # Sincronización diaria de personal desde RRHH (Fase 4), 04:00.
      # Corre el mismo service que POST /api/personal/sync, sin HTTP ni token.
      ofelia.job-exec.sync-personal.schedule: "0 4 * * *"
      ofelia.job-exec.sync-personal.command: "python sync_personal.py"

  # ── Frontend React (SPA estática servida por Nginx) ──────────────────────
  # La imagen debe construirse con VITE_API_URL=/api (secreto del workflow de
  # deploy): el SPA pega al mismo origen y nginx enruta. Con una URL absoluta
  # el navegador haría CORS contra sí mismo.
  frontend:
    image: ghcr.io/gabrielpavezsilva/prevencion-frontend:latest
    restart: unless-stopped
    networks:
      - internal

  # ── Scheduler de tareas (backups, sync de personal) ─────────────────────
  ofelia:
    image: mcuadros/ofelia:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - internal
    command: daemon --docker

  # ── Nginx reverse proxy (routing interno del stack) ─────────────────────
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:${HTTP_PORT:-8082}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend
    networks:
      - internal

volumes:
  postgres_data:
  postgres_backups:

networks:
  internal:
    name: prevencion_network
    driver: bridge
